# PayBridge PostgreSQL Primary Configuration (Lagos Primary Node)
listen_addresses = '*'
port = 5432
max_connections = 200

# Write-Ahead Logging & Replication
wal_level = replica
max_wal_size = 10GB
min_wal_size = 1GB
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'

# Synchronous Streaming Replication
max_wal_senders = 10
wal_keep_size = 4096MB
synchronous_commit = on
synchronous_standby_names = 'FIRST 1 (abuja_standby)'
