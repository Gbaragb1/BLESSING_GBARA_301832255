# PayBridge PostgreSQL Standby Configuration (Abuja Hot Standby Node)
listen_addresses = '*'
port = 5432
hot_standby = on
max_standby_streaming_delay = 30s
wal_receiver_timeout = 60s
primary_conninfo = 'host=lagos-primary.paybridge.internal port=5432 user=rep_user password=SecretStandbyPass application_name=abuja_standby'
primary_slot_name = 'abuja_standby_slot'
